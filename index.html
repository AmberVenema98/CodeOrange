<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Listings</title>
  <link rel="stylesheet" href="style.css">
  <!-- Google Font: Spartan (League Spartan) -->
  <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>

<header class="header-bg"></header>

  <main class="container">
    <!-- Filter bar -->
    <div id="filter-container" class="filter-container">
        <!-- Dropdown filter menu -->
        <div class="dropdown-container">
        <select id="filter-dropdown" class="filter-select">
            <option value="">Filter</option>
        </select>
        </div>
        <div id="filter-tags" class="filter-tags">
            <!-- Tags over here -->
        </div>
        <!-- Clear button -->
        <button id="clear-btn" class="clear-btn">Clear</button>
    </div>

    <!-- List of jobs -->
    <div id="job-list" class="job-list">
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
